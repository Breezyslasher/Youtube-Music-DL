# Beetdrop
#
# Standalone: Beetdrop searches YouTube Music, matches grabs against
# MusicBrainz, writes full tags plus cover art, and files straight into
# the music library. No beets, no inbox.
#
#   docker compose up -d
#   docker compose logs -f beetdrop

services:
  beetdrop:
    image: ghcr.io/breezyslasher/beetdrop:latest
    container_name: beetdrop
    restart: unless-stopped

    ports:
      # host:container. If the host port is already allocated, change only
      # the left side, e.g. "8091:8090".
      - "8090:8090"

    volumes:
      # Persistent state: settings, job history, MusicBrainz cache,
      # uploaded cookies, yt-dlp updates
      - ./config:/config
      # Your music library - fully tagged files land here as
      # Artist/Album (Year)/NN - Title.ext; unmatched grabs under _review/
      - ./music:/music

    environment:
      # User/group that owns the music library
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

      # Optional: single shared password for the API/UI (recommended
      # before exposing through a tunnel or reverse proxy)
      # - BEETDROP_PASSWORD=changeme

      # Optional: default output format (opus, m4a, mp3) and mp3 bitrate;
      # both can also be changed at runtime in Settings.
      # - BEETDROP_FORMAT=opus
      # - BEETDROP_BITRATE=192

      # Optional: synced (timed) lyrics. Toggle, primary source, and the
      # Musixmatch token can all be set at runtime in Settings instead.
      # - BEETDROP_LYRICS=1
      # - BEETDROP_LYRICS_PROVIDER=lrclib   # or musixmatch
      # - BEETDROP_MXM_TOKEN=

      # Optional: music videos (Videos tab). By default they file into a
      # "Music Videos" subfolder of /music - no extra mount needed. Set
      # VIDEO_PATH to a separate mount to keep Kodi's Music Videos source
      # fully separate. Quality caps at 1080p unless changed here/Settings.
      # - VIDEO_PATH=/musicvideos            # and add a /musicvideos volume
      # - BEETDROP_VIDEO_MAX_HEIGHT=1080     # 720/1080/1440/2160, 0 = uncapped

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
